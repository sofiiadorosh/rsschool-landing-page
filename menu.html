<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffe House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header class="header">
    <div class="container header__container">
      <a href="./index.html" class="logo">
        <svg width="100" height="60" class="logo__icon">
          <use href="assets/sprite.svg#icon-logo"></use>
        </svg>
      </a>
      <nav class="navigation">
        <ul class="navigation__list">
          <li class="navigation__item">
            <a class="navigation__link">Favorite coffee</a>
          </li>
          <li class="navigation__item">
            <a class="navigation__link">About</a>
          </li>
          <li class="navigation__item">
            <a class="navigation__link">Mobile app</a>
          </li>
          <li class="navigation__item">
            <a class="navigation__link">Contact us</a>
          </li>
        </ul>
        <a class="menu-link">
          <span>Menu</span>
          <svg class="menu-link__icon">
            <use href="assets/sprite.svg#icon-coffee-cup"></use>
          </svg>
        </a>
      </nav>
      <div class="control">
        <div class="theme-switch">
          <ul class="theme-switch__list">
            <li class="theme-switch__item theme-switch__item_active">
              <svg width="22" height="22" class="theme-switch__icon">
                <use href="assets/sprite.svg#icon-sun"></use>
              </svg>
            </li>
            <li class="theme-switch__item">
              <svg width="18" height="18" class="theme-switch__icon">
                <use href="assets/sprite.svg#icon-moon"></use>
              </svg>
            </li>
          </ul>
        </div>
        <button type="button" class="burger-button"></button>
      </div>
    </div>
  </header>
  <main></main>
  <footer class="footer">
    <div class="container footer__container">
      <div class="footer__content">
        <div class="footer__offer">
          <h2 class="offer__title">
            <span>Sip, Savor, Smile.</span>
            <span class="offer__title_highlight">It’s coffee time!</span>
          </h2>
          <ul class="socials__list">
          <li class="socials__item">
            <a href="https://x.com/" target="_blank" rel="noopener noreferrer" class="socials__link">
              <svg class="socials__icon" width="24" height="24">
                <use href="assets/sprite.svg#icon-twitter"></use>
              </svg>
            </a>
          </li>
          <li class="socials__item">
            <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" class="socials__link">
              <svg class="socials__icon" width="24" height="24">
                <use href="assets/sprite.svg#icon-instagram"></use>
              </svg>
            </a>
          </li>
          <li class="socials__item">
            <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" class="socials__link">
              <svg class="socials__icon" width="24" height="24">
                <use href="assets/sprite.svg#icon-facebook"></use>
              </svg>
            </a>
          </li>
          </ul>
        </div>
        <address class="footer__contact">
          <p class="contact__title">Contact us</p>
          <div class="contact__list">
            <div class="contact__item">
              <a href="https://www.google.com/maps" target="_blank" rel="noopener noreferrer" class="contact__link">
                <svg class="contact__icon" width="20" height="20">
                  <use href="assets/sprite.svg#icon-pin-alt"></use>
                </svg>
                <span class="contact__description">8558 Green Rd.,  LA</span>
              </a>
          </div>
          <div class="contact__item">
            <a href="tel:+16035550123" class="contact__link">
              <svg class="contact__icon" width="20" height="20">
                <use href="assets/sprite.svg#icon-phone"></use>
              </svg>
              <span class="contact__description">+1 (603) 555-0123</span>
            </a>
          </div>
          <div class="contact__item">
            <svg class="contact__icon" width="20" height="20">
              <use href="assets/sprite.svg#icon-clock"></use>
            </svg>
            <span class="contact__description">Mon–Sat: 9:00–23:00</span>
          </div>
        </div>
      </address></div>
    </div>
  </footer>
</body>
</html>
